{{define "dashboard"}}
<style>
    @media (prefers-color-scheme: dark) {
        [aria-label="tip"] {
            --plot-background: #2b3035;
        }
    }
</style>

<main class="container pt-5">
<div class="w-100 m-auto pt-3">
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-price-providers" class="col-form-label">Price per provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-price-providers"></select>
        </div>
    </div>
    <div id="container1"></div>
    <br />
    <br />
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-costs-providers" class="col-form-label">Cost per provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-costs-providers" autofocus="autofocus"></select>
        </div>
    </div>
    <div id="container2"></div>
    <br />
    <br />
    <label class="col-form-label">Electricity usage per provider</label>
    <div id="container3"></div>
    <br />
    <br />
    <label class="col-form-label">Watts per provider</label>
    <div id="container4"></div>
    <br />
    <br />
    <label class="col-form-label">Watts per battery</label>
    <div id="container5"></div>
    <br />
    <br />
    <label class="col-form-label">State of charge per battery</label>
    <div id="container6"></div>
    <br />
    <br />
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-gas-providers" class="col-form-label">Gas usage per provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-gas-providers"></select>
        </div>
    </div>
    <div id="container7"></div>
    <br />
    <br />
</div>
</main>

<script>
$(document).ready(function(){
    'use strict';

    const today = new Date();
    let tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);

    $('#sel-price-providers').on('change', function (event) {
        event.preventDefault();
        const selectedProvider = $(this).val();
        $.ajax({
            url: "{{$.ContextRoot}}api/prices/" + selectedProvider + "/" + today.toISOString().split('T')[0] + "/" + tomorrow.toISOString().split('T')[0],
        }).done(function(data) {
            if (data && data.prices) {
                let markers = [];
                $.each(data.prices, function (series, prices) {
                    $.each(prices, function (i, price) {
                        markers.push({
                            time: Date.parse(price.time),
                            value: price.consumption_price,
                            provider: series
                        });
                    });
                });
                const graph = Plot.plot({
                    x: {
                        type: "time",
                        interval: "hour",
                    },
                    y: {
                        label: "Price in €"
                    },
                    grid: true,
                    width: "1200",
                    color: {
                        legend: true,
                        scheme: "gnbu",
                    },
                    marks: [
                        Plot.ruleY([0]),
                        Plot.axisX({ticks: "day", tickSize: 28, tickPadding: -9, tickFormat: " %A", textAnchor: "start"}),
                        Plot.axisX({ticks: "3 hours", tickFormat: "%H:%M"}),
                        Plot.rectY(markers, {x: "time", y: "value", z: "provider", interval: "hour", fill: "value"}),
                        Plot.tip(markers, Plot.pointerX({x: "time", y: "value", title: function(d) {
                                return 'Time: ' + formatDate(new Date(d.time))  + '\n Price: €' + d.value;
                            }, class: 'tooltipclass'
                        })),
                    ]
                })

                function formatDate(date) {
                    let hour = date.getHours();
                    let endHour = hour + 1
                    hour = hour < 10 ? ('0' + hour) : hour;
                    let minutes = date.getMinutes()
                    minutes = minutes < 10 ? ('0' + minutes) : minutes;
                    if (endHour >= 24) {
                        endHour = 0
                    }
                    endHour = endHour < 10 ? ('0' + endHour) : endHour;
                    return hour + ':' + minutes + '-' + endHour + ':' + minutes;
                }

                $('#container1').empty().append(graph);
            }
        });
    });

    $('#sel-costs-providers').on('change', function (event) {
        event.preventDefault();
        const selectedProvider = $(this).val();

        $.ajax({
            url: "{{$.ContextRoot}}api/electricity/" + selectedProvider + "/costs/" + yesterday.toISOString().split('T')[0],
        }).done(function (data) {
            if (data && data.costs) {
                let markers = [];
                $.each(data.costs, function (series, costs) {
                    $.each(costs, function (i, cost) {
                        markers.push({
                            // cost.time is the endtime of the calculation. So shift the marker 1 hour to the left.
                            time: Date.parse(cost.time) - 3600000,
                            value: cost.net_costs,
                            provider: series
                        });
                    });
                });
                const graph = Plot.plot({
                    x: {
                        type: "time",
                        interval: "hour",
                    },
                    y: {
                        label: "Costs in €"
                    },
                    grid: true,
                    width: "1200",
                    color: {
                        legend: true,
                        scheme: "gnbu",
                    },
                    marks: [
                        Plot.ruleY([0]),
                        Plot.axisX({
                            ticks: "day",
                            tickSize: 28,
                            tickPadding: -9,
                            tickFormat: " %A",
                            textAnchor: "start"
                        }),
                        Plot.axisX({ticks: "3 hours", tickFormat: "%H:%M"}),
                        Plot.rectY(markers, {x: "time", y: "value", z: "provider", interval: "hour", fill: "value"}),
                        Plot.tip(markers, Plot.pointerX({
                            x: "time", y: "value", title: function (d) {
                                return 'Time: ' + formatDate(new Date(d.time)) + '\n Costs: €' + d.value;
                            }
                        })),
                    ]
                })

                function formatDate(date) {
                    let hour = date.getHours();
                    let endHour = hour + 1
                    hour = hour < 10 ? ('0' + hour) : hour;
                    let minutes = date.getMinutes()
                    minutes = minutes < 10 ? ('0' + minutes) : minutes;
                    if (endHour >= 24) {
                        endHour = 0
                    }
                    endHour = endHour < 10 ? ('0' + endHour) : endHour;
                    return hour + ':' + minutes + '-' + endHour + ':' + minutes;
                }

                $('#container2').empty().append(graph);
            }
        });
    });

    $('#sel-gas-providers').on('change', function (event) {
        event.preventDefault();
        const selectedProvider = $(this).val();

        $.ajax({
            url: "{{$.ContextRoot}}api/gas/" + selectedProvider + "/usages/" + yesterday.toISOString().split('T')[0],
        }).done(function (data) {
            if (data && data.usages) {
                let markers = [];
                $.each(data.usages, function (source, usageSerie) {
                    let lastIterationConsumed;
                    let lastDate
                    $.each(usageSerie.usages, function(i, usage) {
                        if (lastIterationConsumed) {
                            markers.push({
                                time: lastDate,
                                value: (usage.gas_consumed - lastIterationConsumed),
                                provider: source
                            });
                        }
                        lastIterationConsumed = usage.gas_consumed;
                        lastDate = Date.parse(usage.time);
                    });
                });
                const graph = Plot.plot({
                    x: {
                        type: "time",
                        interval: "hour",
                    },
                    y: {
                        label: "Usage in m3"
                    },
                    grid: true,
                    width: "1200",
                    color: {
                        legend: true,
                        scheme: "gnbu",
                    },
                    marks: [
                        Plot.ruleY([0]),
                        Plot.axisX({
                            ticks: "day",
                            tickSize: 28,
                            tickPadding: -9,
                            tickFormat: " %A",
                            textAnchor: "start"
                        }),
                        Plot.axisX({ticks: "3 hours", tickFormat: "%H:%M"}),
                        Plot.rectY(markers, {x: "time", y: "value", z: "provider", interval: "hour", fill: "value"}),
                        Plot.tip(markers, Plot.pointerX({
                            x: "time", y: "value", title: function (d) {
                                return 'Time: ' + formatDate(new Date(d.time)) + '\n Usage: ' + d.value.toFixed(3) + ' m3';
                            }
                        })),
                    ]
                })

                function formatDate(date) {
                    let hour = date.getHours();
                    let endHour = hour + 1
                    hour = hour < 10 ? ('0' + hour) : hour;
                    let minutes = date.getMinutes()
                    minutes = minutes < 10 ? ('0' + minutes) : minutes;
                    if (endHour >= 24) {
                        endHour = 0
                    }
                    endHour = endHour < 10 ? ('0' + endHour) : endHour;
                    return hour + ':' + minutes + '-' + endHour + ':' + minutes;
                }

                $('#container7').empty().append(graph);
            }
        });
    });


    $.ajax({
        url: "{{$.ContextRoot}}api/prices/providers/" + yesterday.toISOString().split('T')[0],
    }).done(function(data) {
        if (!data || !data.providers) {
            return;
        }
        const $priceProviders = $('#sel-price-providers');
        const $costsProviders = $('#sel-costs-providers');
        $(data.providers).each(function (index, provider) {
            const $option = $('<option>').attr('value', provider).text(provider)
            if (data.grid && provider === data.grid) {
                $option.attr('selected', 'selected')
            }
            $priceProviders.append($option.clone());
            $costsProviders.append($option.clone());
        });
        $priceProviders.trigger("change");
        $costsProviders.trigger("change");
    });

    $.ajax({
        url: "{{$.ContextRoot}}api/gas/sources/" + yesterday.toISOString().split('T')[0],
    }).done(function(data) {
        if (!data || !data.sources) {
            return;
        }
        const $gasProviders = $('#sel-gas-providers');
        $(data.sources).each(function (index, source) {
            const $option = $('<option>').attr('value', source).text(source)
            if (data.grid && source === data.grid) {
                $option.attr('selected', 'selected')
            }
            $gasProviders.append($option.clone());
        });
        $gasProviders.trigger("change");
    });

    $.ajax({
        url: "{{$.ContextRoot}}api/electricity/usages/" + today.toISOString().split('T')[0],
    }).done(function(data) {
        if (data && data.usages) {
            let markers = [];
            $.each(data.usages, function(series, usageSerie) {
                let lastIterationConsumed;
                let lastIterationProvided;
                let lastDate
                $.each(usageSerie.usages, function(i, usage) {
                    if (lastIterationConsumed) {
                        markers.push({
                            time: lastDate,
                            value: (usage.total_energy_consumed - lastIterationConsumed),
                            provider: series + " - Consumed"
                        });
                    }
                    lastIterationConsumed = usage.total_energy_consumed;
                    if (lastIterationProvided) {
                        markers.push({
                            time: lastDate,
                            value: (lastIterationProvided - usage.total_energy_provided),
                            provider: series + " - Provided"
                        });
                    }
                    lastIterationProvided = usage.total_energy_provided;
                    lastDate = Date.parse(usage.time);
                });
            });
            const graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "kWh"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(markers, {
                        x: "time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        curve: "natural",
                        marker: "circle",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(markers, Plot.pointerX({x: "time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                let endHour = hour + 1
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                if (endHour >= 24) {
                                    endHour = 0
                                }
                                endHour = endHour < 10 ? ('0' + endHour) : endHour;
                                return hour + ':' + minutes + '-' + endHour + ':' + minutes;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.time))  + '\n ' + d.value.toFixed(2) + 'kWh';
                        }})),
                ]
            });
            // let color = graph.scale("color");
            // const domain = color.domain;
            // const range = color.range;

            $('#container3').append(graph);
        }
    });

    $.ajax({
        url: "{{$.ContextRoot}}api/electricity/states/" + today.toISOString().split('T')[0],
    }).done(function(data) {
        if (data && data.states) {
            let currentMarkers = [];
            let powerMarkers = [];
            $.each(data.states, function(series, stateSerie) {
                $.each(stateSerie.states, function(i, state) {
                    currentMarkers.push({
                        time: Date.parse(state.time),
                        value: (state.total_current),
                        provider: series
                    });
                    powerMarkers.push({
                        time: Date.parse(state.time),
                        value: (state.total_power),
                        provider: series
                    });
                });
            });
            let graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "Watt"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(powerMarkers, {
                        x: "time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        // curve: "natural",
                        // marker: "circle",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(powerMarkers, Plot.pointerX({x: "time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                let seconds = date.getSeconds()
                                seconds = seconds < 10 ? ('0' + seconds) : seconds;
                                return hour + ':' + minutes + ':' + seconds;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.time))  + '\n ' + d.value.toFixed(2) + 'W';
                        }})),
                ]
            });
            $('#container4').append(graph);
        }
    });

    $.ajax({
        url: "{{$.ContextRoot}}api/battery/states/" + today.toISOString().split('T')[0],
    }).done(function(data) {
        if (data && data.states) {
            let currentMarkers = [];
            let powerMarkers = [];
            let voltageMarkers = [];
            let socMarkers = [];
            $.each(data.states, function(series, stateSerie) {
                $.each(stateSerie.states, function(i, state) {
                    currentMarkers.push({
                        time: Date.parse(state.time),
                        value: (state.current),
                        provider: series
                    });
                    powerMarkers.push({
                        time: Date.parse(state.time),
                        value: (state.power),
                        provider: series
                    });
                    voltageMarkers.push({
                        time: Date.parse(state.time),
                        value: (state.voltage),
                        provider: series
                    });
                    socMarkers.push({
                        time: Date.parse(state.time),
                        value: (state.soc),
                        provider: series
                    });
                });
            });
            let graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "Watt"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(powerMarkers, {
                        x: "time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        // curve: "natural",
                        // marker: "circle",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(powerMarkers, Plot.pointerX({x: "time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                let seconds = date.getSeconds()
                                seconds = seconds < 10 ? ('0' + seconds) : seconds;
                                return hour + ':' + minutes + ':' + seconds;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.time))  + '\n ' + d.value.toFixed(2) + 'W';
                        }})),
                ]
            });
            $('#container5').append(graph);

            graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "SoC"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(socMarkers, {
                        x: "time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        // curve: "natural",
                        // marker: "circle",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(socMarkers, Plot.pointerX({x: "time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                let seconds = date.getSeconds()
                                seconds = seconds < 10 ? ('0' + seconds) : seconds;
                                return hour + ':' + minutes + ':' + seconds;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.time))  + '\n ' + d.value.toFixed(2) + '%';
                        }})),
                ]
            });
            $('#container6').append(graph);
        }
    });

});
</script>
{{end}}
