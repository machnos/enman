{{define "dashboard"}}
<style>
    @media (prefers-color-scheme: dark) {
        [aria-label="tip"] {
            --plot-background: #2b3035;
        }
    }
</style>

<main class="container pt-5">
<div class="w-100 m-auto pt-3">
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-price-providers" class="col-form-label">Price per provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-price-providers"></select>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-price-energy-type"></select>
        </div>
    </div>
    <div id="container1"></div>
    <br />
    <br />
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-costs-providers" class="col-form-label">Cost per provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-costs-providers"></select>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-costs-energy-type"></select>
        </div>
    </div>
    <div id="container2"></div>
    <br />
    <br />
    <label class="col-form-label">Electricity usage per provider</label>
    <div id="container3"></div>
    <br />
    <br />
    <label class="col-form-label">Watts per provider</label>
    <div id="container4"></div>
    <br />
    <br />
    <label class="col-form-label">Watts per battery</label>
    <div id="container5"></div>
    <br />
    <br />
    <label class="col-form-label">State of charge per battery</label>
    <div id="container6"></div>
    <br />
    <br />
    <label class="col-form-label">Battery optimizer plan</label>
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-plan-provider" class="col-form-label small">Price provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-plan-provider"></select>
        </div>
        <div class="col-auto">
            <label for="sel-plan-battery" class="col-form-label small">Battery</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-plan-battery"></select>
        </div>
    </div>
    <div id="container-plan-action"></div>
    <div id="container-plan-forecast"></div>
    <div id="container-plan-soc"></div>
    <br />
    <br />
    <div class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="sel-gas-providers" class="col-form-label">Gas usage per provider</label>
        </div>
        <div class="col-auto">
            <select class="form-select form-select-sm" id="sel-gas-providers"></select>
        </div>
    </div>
    <div id="container7"></div>
    <br />
    <br />
</div>
</main>

<script>
$(document).ready(function(){
    'use strict';
    const aggregateFunctionMean = "mean";
    const aggregateFunctionMin = "min";
    const aggregateFunctionMax = "max";
    const aggregateFunctionSum = "sum";
    const providerMap = new Map();


    const today = new Date();
    let tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);

    $('#sel-price-energy-type').on('change', function (event) {
        event.preventDefault();
        loadPrices($('#sel-price-providers').val(), $(this).val())
    });

    $('#sel-costs-energy-type').on('change', function (event) {
        event.preventDefault();
        loadCosts($('#sel-costs-providers').val(), $(this).val())
    });

    $('#sel-price-providers').on('change', function (event) {
        event.preventDefault();
        const selectedProvider = $(this).val();

        const $priceEnergyType = $('#sel-price-energy-type');
        const currentEnergyType = $priceEnergyType.val();
        $priceEnergyType.empty()
        $(providerMap.get(selectedProvider)).each(function (index, energyType) {
            const $option = $('<option>').attr('value', energyType).text(capitalize(energyType));
            if (energyType === currentEnergyType) {
                $option.attr('selected', 'selected')
            }
            $priceEnergyType.append($option.clone());
        });

        loadPrices(selectedProvider, $priceEnergyType.val())
    });

    $('#sel-costs-providers').on('change', function (event) {
        event.preventDefault();
        const selectedProvider = $(this).val();

        const $costsEnergyType = $('#sel-costs-energy-type');
        const currentEnergyType = $costsEnergyType.val();
        $costsEnergyType.empty()
        $(providerMap.get(selectedProvider)).each(function (index, energyType) {
            const $option = $('<option>').attr('value', energyType).text(capitalize(energyType));
            if (energyType === currentEnergyType) {
                $option.attr('selected', 'selected')
            }
            $costsEnergyType.append($option.clone());
        });
        if (providerMap.get(selectedProvider).length > 1) {
            $costsEnergyType.append($('<hr>'));
            $costsEnergyType.append($('<option>').attr('value', '').text("Total"));
        }

        loadCosts(selectedProvider, $costsEnergyType.val())
    });

    $('#sel-gas-providers').on('change', function (event) {
        event.preventDefault();
        const selectedProvider = $(this).val();

        $.ajax({
            url: "{{$.ContextRoot}}api/gas/" + selectedProvider + "/usages/" + yesterday.toISOString().split('T')[0] + "?aggregate_functions=" + aggregateFunctionMin + "," + aggregateFunctionMax,
        }).done(function (data) {
            if (data && data.sources) {
                let markers = [];
                $.each(data.sources, function (source, serie) {
                    $.each(serie.buckets, function(i, bucket) {
                        markers.push({
                            start_time: Date.parse(bucket.start_time),
                            end_time: Date.parse(bucket.end_time),
                            value: (bucket.usages[aggregateFunctionMax].gas_consumed - bucket.usages[aggregateFunctionMin].gas_consumed),
                            provider: source
                        });
                    });
                });
                const graph = Plot.plot({
                    x: {
                        type: "time",
                        interval: "hour",
                        label: "Time"
                    },
                    y: {
                        label: "Usage in m3"
                    },
                    grid: true,
                    width: "1200",
                    color: {
                        legend: true,
                        scheme: "gnbu",
                    },
                    marks: [
                        Plot.ruleY([0]),
                        Plot.axisX({
                            ticks: "day",
                            tickSize: 28,
                            tickPadding: -9,
                            tickFormat: " %A",
                            textAnchor: "start"
                        }),
                        Plot.axisX({ticks: "3 hours", tickFormat: "%H:%M"}),
                        Plot.rectY(markers, {
                            x: "start_time",
                            y: "value",
                            z: "provider",
                            interval: "hour",
                            fill: "value",
                            channels: {
                                title: function (d) {
                                    return 'Time: ' + formatDate(new Date(d.start_time), new Date(d.end_time)) + '\n Usage: ' + d.value.toFixed(3) + ' m3';
                                }
                            },
                            tip: true
                        })
                    ]
                })

                function formatDate(startDate, endDate) {
                    let startHour = startDate.getHours();
                    let startMinutes = startDate.getMinutes()
                    let endHour = endDate.getHours();
                    let endMinutes = endDate.getMinutes()
                    startHour = startHour < 10 ? ('0' + startHour) : startHour;
                    startMinutes = startMinutes < 10 ? ('0' + startMinutes) : startMinutes;
                    endHour = endHour < 10 ? ('0' + endHour) : endHour;
                    endMinutes = endMinutes < 10 ? ('0' + endMinutes) : endMinutes;
                    return startHour + ':' + startMinutes + '-' + endHour + ':' + endMinutes;
                }

                $('#container7').empty().append(graph);
            }
        });
    });


    $.ajax({
        url: "{{$.ContextRoot}}api/prices/providers/" + yesterday.toISOString().split('T')[0],
    }).done(function(data) {
        if (!data || !data.providers) {
            return;
        }
        const $priceProviders = $('#sel-price-providers');
        const $costsProviders = $('#sel-costs-providers');
        $(data.providers).each(function (index, provider) {
            providerMap.set(provider.name, provider.energy_types.sort())
            const $option = $('<option>').attr('value', provider.name).text(provider.name)
            if (data.grid && provider.name === data.grid) {
                $option.attr('selected', 'selected')
            }
            $priceProviders.append($option.clone());
            $costsProviders.append($option.clone());
        });
        $priceProviders.trigger("change");
        $costsProviders.trigger("change");
    });

    $.ajax({
        url: "{{$.ContextRoot}}api/gas/sources/" + yesterday.toISOString().split('T')[0],
    }).done(function(data) {
        if (!data || !data.sources) {
            return;
        }
        const $gasProviders = $('#sel-gas-providers');
        $(data.sources).each(function (index, source) {
            const $option = $('<option>').attr('value', source).text(source)
            if (data.grid && source === data.grid) {
                $option.attr('selected', 'selected')
            }
            $gasProviders.append($option.clone());
        });
        $gasProviders.trigger("change");
    });

    $.ajax({
        url: "{{$.ContextRoot}}api/electricity/usages/" + today.toISOString().split('T')[0] + "?aggregate_functions=" + aggregateFunctionMin + "," + aggregateFunctionMax,
    }).done(function(data) {
        if (data && data.sources) {
            let markers = [];
            $.each(data.sources, function(source, serie) {
                $.each(serie.buckets, function(i, bucket) {
                    markers.push({
                        start_time: Date.parse(bucket.start_time),
                        end_time: Date.parse(bucket.end_time),
                        value: (bucket.usages[aggregateFunctionMax].total_energy_consumed - bucket.usages[aggregateFunctionMin].total_energy_consumed),
                        provider: source + " - Consumed"
                    });
                    markers.push({
                        start_time: Date.parse(bucket.start_time),
                        end_time: Date.parse(bucket.end_time),
                        value: (bucket.usages[aggregateFunctionMax].total_energy_provided - bucket.usages[aggregateFunctionMin].total_energy_provided),
                        provider: source + " - Provided"
                    });
                });
            });
            const graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "kWh"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(markers, {
                        x: "start_time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        curve: "natural",
                        marker: "circle",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(markers, Plot.pointerX({x: "start_time", y: "value", title: function(d) {
                            return d.provider + '\nTime: ' + formatDate(new Date(d.start_time), new Date(d.end_time))  + '\n ' + d.value.toFixed(2) + 'kWh';
                        }})),
                ]
            });
            // let color = graph.scale("color");
            // const domain = color.domain;
            // const range = color.range;

            function formatDate(startDate, endDate) {
                let startHour = startDate.getHours();
                let startMinutes = startDate.getMinutes()
                let endHour = endDate.getHours();
                let endMinutes = endDate.getMinutes()
                startHour = startHour < 10 ? ('0' + startHour) : startHour;
                startMinutes = startMinutes < 10 ? ('0' + startMinutes) : startMinutes;
                endHour = endHour < 10 ? ('0' + endHour) : endHour;
                endMinutes = endMinutes < 10 ? ('0' + endMinutes) : endMinutes;
                return startHour + ':' + startMinutes + '-' + endHour + ':' + endMinutes;
            }


            $('#container3').append(graph);
        }
    });

    $.when(
        $.ajax({ url: "{{$.ContextRoot}}api/electricity/states/" + today.toISOString().split('T')[0] + "?aggregate_functions=" + aggregateFunctionMean + "&fields=total_power" }),
        $.ajax({ url: "{{$.ContextRoot}}api/electricity/forecast/" + today.toISOString().split('T')[0] })
    ).done(function(statesRes, forecastRes) {
        const data = statesRes && statesRes[0];
        const forecastData = (forecastRes && forecastRes[0]) || {};
        if (data && data.sources) {
            let powerMarkers = [];
            $.each(data.sources, function(source, serie) {
                $.each(serie.buckets, function(i, bucket) {
                    powerMarkers.push({
                        start_time: Date.parse(bucket.start_time),
                        end_time: Date.parse(bucket.end_time),
                        value: (bucket.states[aggregateFunctionMean].total_power),
                        provider: source
                    });
                });
            });
            let forecastMarkers = [];
            $.each(forecastData.sources || {}, function(source, group) {
                $.each(group.buckets || [], function(_, b) {
                    forecastMarkers.push({
                        start_time: Date.parse(b.bucket_start),
                        value: b.watts,
                        provider: source + ' (forecast)'
                    });
                });
            });
            let graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "Watt"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(powerMarkers, {
                        x: "start_time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                    }),
                    Plot.line(forecastMarkers, {
                        x: "start_time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 1.5,
                        strokeDasharray: "4,3",
                        curve: "step-after",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(powerMarkers, Plot.pointerX({x: "start_time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                let seconds = date.getSeconds()
                                seconds = seconds < 10 ? ('0' + seconds) : seconds;
                                return hour + ':' + minutes + ':' + seconds;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.start_time))  + '\n ' + d.value.toFixed(2) + 'W';
                        }})),
                ]
            });
            $('#container4').append(graph);
        }
    });

    $.when(
        $.ajax({ url: "{{$.ContextRoot}}api/battery/states/" + today.toISOString().split('T')[0] + "?aggregate_functions=" + aggregateFunctionMean + "&fields=power,soc" }),
        $.ajax({ url: "{{$.ContextRoot}}api/battery/forecast/" + today.toISOString().split('T')[0] })
    ).done(function(statesRes, forecastRes) {
        const data = statesRes && statesRes[0];
        const forecastData = (forecastRes && forecastRes[0]) || {};
        if (data && data.sources) {
            let powerMarkers = [];
            let socMarkers = [];
            $.each(data.sources, function(source, serie) {
                $.each(serie.buckets, function(i, bucket) {
                    powerMarkers.push({
                        start_time: Date.parse(bucket.start_time),
                        end_time: Date.parse(bucket.end_time),
                        value: bucket.states[aggregateFunctionMean].power,
                        provider: source
                    });
                    socMarkers.push({
                        start_time: Date.parse(bucket.start_time),
                        end_time: Date.parse(bucket.end_time),
                        value: bucket.states[aggregateFunctionMean].soc,
                        provider: source
                    });
                });
            });
            let forecastPowerMarkers = [];
            $.each(forecastData.sources || {}, function(source, group) {
                $.each(group.buckets || [], function(_, b) {
                    forecastPowerMarkers.push({
                        start_time: Date.parse(b.bucket_start),
                        value: b.watts,
                        provider: source + ' (forecast)'
                    });
                });
            });

            let graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "Watt"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(powerMarkers, {
                        x: "start_time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        // curve: "natural",
                        // marker: "circle",
                    }),
                    Plot.line(forecastPowerMarkers, {
                        x: "start_time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 1.5,
                        strokeDasharray: "4,3",
                        curve: "step-after",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(powerMarkers, Plot.pointerX({x: "start_time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                let seconds = date.getSeconds()
                                seconds = seconds < 10 ? ('0' + seconds) : seconds;
                                return hour + ':' + minutes + ':' + seconds;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.start_time))  + '\n ' + d.value.toFixed(2) + 'W';
                        }})),
                ]
            });
            $('#container5').append(graph);

            graph = Plot.plot({
                x: {
                    type: "time",
                    label: "Time"
                },
                y: {
                    label: "SoC"
                },
                grid: true,
                width: "1200",
                color: {
                    scheme: "blues",
                    legend: true
                },
                marks: [
                    Plot.line(socMarkers, {
                        x: "start_time",
                        y: "value",
                        stroke: "provider",
                        strokeWidth: 2,
                        // curve: "natural",
                        // marker: "circle",
                    }),
                    Plot.ruleY([0]),
                    Plot.tip(socMarkers, Plot.pointerX({x: "start_time", y: "value", title: function(d) {
                            function formatDate(date) {
                                let hour = date.getHours();
                                hour = hour < 10 ? ('0' + hour) : hour;
                                let minutes = date.getMinutes()
                                minutes = minutes < 10 ? ('0' + minutes) : minutes;
                                let seconds = date.getSeconds()
                                seconds = seconds < 10 ? ('0' + seconds) : seconds;
                                return hour + ':' + minutes + ':' + seconds;
                            }
                            return d.provider + '\nTime: ' + formatDate(new Date(d.start_time))  + '\n ' + d.value.toFixed(2) + '%';
                        }})),
                ]
            });
            $('#container6').append(graph);
        }
    });

    function loadPrices(provider, energyType) {
        $.ajax({
            url: "{{$.ContextRoot}}api/prices/" + provider + "/" + energyType + "/" + today.toISOString().split('T')[0] + "/" + tomorrow.toISOString().split('T')[0],
        }).done(function(data) {
            if (data && data.prices) {
                let markers = [];
                $.each(data.prices, function (series, prices) {
                    $.each(prices, function (i, price) {
                        markers.push({
                            time: Date.parse(price.time),
                            value: price.consumption_price,
                            provider: series
                        });
                    });
                });
                const graph = Plot.plot({
                    x: {
                        type: "time",
                        interval: "hour"
                    },
                    y: {
                        label: "Price in €"
                    },
                    grid: true,
                    width: "1200",
                    color: {
                        legend: true,
                        scheme: "gnbu",
                    },
                    marks: [
                        Plot.ruleY([0]),
                        Plot.axisX({ticks: "day", tickSize: 28, tickPadding: -9, tickFormat: " %A", textAnchor: "start"}),
                        Plot.axisX({ticks: "3 hours", tickFormat: "%H:%M"}),
                        Plot.rectY(markers, {
                            x: "time",
                            y: "value",
                            z: "provider",
                            interval: "hour",
                            fill: "value",
                            channels: {
                                title: function(d) {
                                    return 'Time: ' + formatDate(new Date(d.time))  + '\n Price: €' + d.value;
                                }
                            },
                            tip: true
                        }),
                    ]
                })

                function formatDate(date) {
                    let hour = date.getHours();
                    let endHour = hour + 1
                    hour = hour < 10 ? ('0' + hour) : hour;
                    let minutes = date.getMinutes()
                    minutes = minutes < 10 ? ('0' + minutes) : minutes;
                    if (endHour >= 24) {
                        endHour = 0
                    }
                    endHour = endHour < 10 ? ('0' + endHour) : endHour;
                    return hour + ':' + minutes + '-' + endHour + ':' + minutes;
                }

                $('#container1').empty().append(graph);
            }
        });
    }

    function loadCosts(provider, energyType) {
        let calls = [];
        let energyTypes = [];
        if (energyType) {
            energyTypes.push(energyType);
            calls.push($.ajax({
                url: "{{$.ContextRoot}}api/" + energyType + "/" + provider + "/costs/" + yesterday.toISOString().split('T')[0] + "?aggregate_functions=" + aggregateFunctionSum + "&fields=net_costs",
            }));
        } else {
            $(providerMap.get(provider)).each(function (index, energyType) {
                energyTypes.push(energyType);
                calls.push($.ajax({
                    url: "{{$.ContextRoot}}api/" + energyType + "/" + provider + "/costs/" + yesterday.toISOString().split('T')[0] + "?aggregate_functions=" + aggregateFunctionSum + "&fields=net_costs",
                }))
            });
        }
        let markers = [];
        $.when.apply(null, calls).done(function() {
            let responses = [];
            if (Array.isArray(arguments[0])) {
                for (let i = 0; i < arguments.length; i++) {
                    responses.push(arguments[i]);
                }
            } else {
                responses.push([arguments[0]]);
            }
            $(responses).each(function (index, response) {
                if (response[0] && response[0].sources) {
                    $.each(response[0].sources, function (source, buckets) {
                        $.each(buckets, function (i, bucket) {
                            markers.push({
                                start_time: Date.parse(bucket.start_time),
                                end_time: Date.parse(bucket.end_time),
                                value: bucket.costs[aggregateFunctionSum].net_costs,
                                provider: source,
                                energy_type: energyTypes[index]
                            });
                        });
                    });

                }
            });
            const graph = Plot.plot({
                x: {
                    type: "time",
                    interval: "hour",
                    label: "Time"
                },
                y: {
                    label: "Costs in €"
                },
                grid: true,
                width: "1200",
                color: {
                    legend: true,
                    scheme: "gnbu",
                },
                marks: [
                    Plot.ruleY([0]),
                    Plot.axisX({
                        ticks: "day",
                        tickSize: 28,
                        tickPadding: -9,
                        tickFormat: " %A",
                        textAnchor: "start"
                    }),
                    Plot.axisX({ticks: "3 hours", tickFormat: "%H:%M"}),
                    Plot.rectY(markers, {
                        x: "start_time",
                        y: "value",
                        z: "energy_type",
                        interval: "hour",
                        fill: energyTypes.length > 1 ? "energy_type" : "value",
                        channels: {
                            title: function (d) {
                                let baseTip = 'Time: ' + formatDate(new Date(d.start_time), new Date(d.end_time)) + '\nCosts: €' + d.value;
                                if (energyTypes.length > 1) {
                                    baseTip += '\nEnergy type: ' + capitalize(d.energy_type);
                                }
                                return baseTip;
                            }
                        },
                        tip: true,
                    }),
                ]
            })

            function formatDate(startDate, endDate) {
                let startHour = startDate.getHours();
                let startMinutes = startDate.getMinutes()
                let endHour = endDate.getHours();
                let endMinutes = endDate.getMinutes()
                startHour = startHour < 10 ? ('0' + startHour) : startHour;
                startMinutes = startMinutes < 10 ? ('0' + startMinutes) : startMinutes;
                endHour = endHour < 10 ? ('0' + endHour) : endHour;
                endMinutes = endMinutes < 10 ? ('0' + endMinutes) : endMinutes;
                return startHour + ':' + startMinutes + '-' + endHour + ':' + endMinutes;
            }

            $('#container2').empty().append(graph);
        });
    }


    function capitalize(val) {
        return String(val).charAt(0).toUpperCase() + String(val).slice(1);
    }

    // ----- Battery optimizer plan -----------------------------------------
    let dayAfterTomorrow = new Date();
    dayAfterTomorrow.setDate(dayAfterTomorrow.getDate() + 2);

    function planFormatTime(d) {
        const pad = (n) => (n < 10 ? '0' + n : '' + n);
        return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function actionColor(action) {
        switch (action) {
            case "charge_from_grid":  return "#1f77b4"; // blue
            case "charge_from_pv":    return "#2ca02c"; // green
            case "discharge_to_home": return "#ff7f0e"; // orange
            case "discharge_to_grid": return "#d62728"; // red
            case "export_only":       return "#9467bd"; // purple
            default:                  return "#999";
        }
    }

    function loadPlan(provider, battery) {
        const start = today.toISOString().split('T')[0];
        const end = dayAfterTomorrow.toISOString().split('T')[0];

        // Fetch prices, electricity forecasts and battery forecast in parallel.
        const pricesCall = provider
            ? $.ajax({ url: "{{$.ContextRoot}}api/prices/" + provider + "/electricity/" + start + "/" + end })
            : $.Deferred().resolve({ prices: {} }).promise();
        const elecCall = $.ajax({ url: "{{$.ContextRoot}}api/electricity/forecast/" + start + "/" + end });
        const battCall = battery
            ? $.ajax({ url: "{{$.ContextRoot}}api/battery/" + battery + "/forecast/" + start + "/" + end })
            : $.ajax({ url: "{{$.ContextRoot}}api/battery/forecast/" + start + "/" + end });

        $.when(pricesCall, elecCall, battCall).done(function (pricesRes, elecRes, battRes) {
            const pricesData = (pricesRes && pricesRes[0]) || {};
            const elecData   = (elecRes && elecRes[0])   || {};
            const battData   = (battRes && battRes[0])   || {};

            // -------- Forecast & price chart --------
            const priceMarkers = [];
            if (pricesData.prices) {
                $.each(pricesData.prices, function (series, prices) {
                    $.each(prices, function (_, price) {
                        priceMarkers.push({
                            time: Date.parse(price.time),
                            consumption: price.consumption_price,
                            feedback: price.feedback_price,
                            provider: series
                        });
                    });
                });
            }

            const forecastMarkers = [];
            function pushForecast(group, sourceName) {
                if (!group || !group.buckets) return;
                const labelKind = group.kind === 'pv' ? 'PV' : 'Load';
                $.each(group.buckets, function (_, b) {
                    forecastMarkers.push({
                        time: Date.parse(b.bucket_start),
                        watts: b.watts,
                        kind: labelKind + ' (' + sourceName + ')'
                    });
                });
            }
            $.each(elecData.sources || {}, function (sourceName, group) { pushForecast(group, sourceName); });

            const forecastChart = Plot.plot({
                width: 1200,
                height: 300,
                grid: true,
                x: { type: "time", label: "Time" },
                y: { label: "Forecast (W)" },
                color: { legend: true },
                marks: [
                    Plot.ruleY([0]),
                    Plot.axisX({ ticks: "day", tickSize: 28, tickPadding: -9, tickFormat: " %A", textAnchor: "start" }),
                    Plot.axisX({ ticks: "3 hours", tickFormat: "%H:%M" }),
                    Plot.line(forecastMarkers, {
                        x: "time", y: "watts", stroke: "kind", strokeWidth: 2, curve: "step-after",
                        strokeDasharray: "4,3"
                    }),
                    Plot.tip(forecastMarkers, Plot.pointerX({
                        x: "time", y: "watts",
                        title: function (d) {
                            return d.kind + '\n' + planFormatTime(new Date(d.time)) + '\n' + d.watts.toFixed(0) + ' W';
                        }
                    }))
                ]
            });
            $('#container-plan-forecast').empty().append(forecastChart);

            // -------- Battery forecast chart (dotted bars: + charge / − discharge) --------
            const batteryMarkers = [];
            $.each(battData.sources || {}, function (sourceName, group) {
                $.each(group.buckets || [], function (_, b) {
                    batteryMarkers.push({
                        time: Date.parse(b.bucket_start),
                        end_time: Date.parse(b.bucket_start) + b.bucket_size_seconds * 1000,
                        watts: b.watts,
                        battery: sourceName
                    });
                });
            });

            const actionChart = Plot.plot({
                width: 1200,
                height: 320,
                grid: true,
                x: { type: "time", label: "Time" },
                y: { label: "Forecast battery power (W) — + charge / − discharge" },
                color: { legend: true },
                marks: [
                    Plot.ruleY([0]),
                    Plot.axisX({ ticks: "day", tickSize: 28, tickPadding: -9, tickFormat: " %A", textAnchor: "start" }),
                    Plot.axisX({ ticks: "3 hours", tickFormat: "%H:%M" }),
                    Plot.rect(batteryMarkers, {
                        x1: "time",
                        x2: "end_time",
                        y1: 0,
                        y2: "watts",
                        fill: "battery",
                        fillOpacity: 0.35,
                        stroke: "battery",
                        strokeDasharray: "4,3",
                        channels: {
                            title: function (d) {
                                return d.battery + '\n' + planFormatTime(new Date(d.time))
                                    + '\nPower: ' + d.watts.toFixed(0) + ' W';
                            }
                        },
                        tip: true
                    })
                ]
            });
            $('#container-plan-action').empty().append(actionChart);
            // SoC chart removed: predicted SoC is no longer part of the forecast payload.
            $('#container-plan-soc').empty();
        });
    }

            // -------- Action chart (bars + price overlay) --------
            // Flatten schedule across all returned batteries unless a specific
            // one was requested.
            const actionMarkers = [];
            const socMarkers = [];
            $.each(schedData.batteries || {}, function (batteryName, group) {
                $.each(group.buckets || [], function (_, b) {
                    actionMarkers.push({
                        time: Date.parse(b.bucket_start),
                        size_seconds: b.bucket_size_seconds,
                        end_time: Date.parse(b.bucket_start) + b.bucket_size_seconds * 1000,
                        power_w: b.power_w,
                        action: b.action,
                        reason: b.reason,
                        battery: batteryName
                    });
                    socMarkers.push({
                        time: Date.parse(b.bucket_start),
                        soc: b.predicted_soc,
                        battery: batteryName
                    });
                });
            });

            const actionChart = Plot.plot({
                width: 1200,
                height: 320,
                grid: true,
                x: { type: "time", label: "Time" },
                y: { label: "Planned battery power (W) — + charge / − discharge" },
                color: {
                    legend: true,
                    domain: ["charge_from_grid", "charge_from_pv", "discharge_to_home", "discharge_to_grid", "export_only", "idle"],
                    range:  ["#1f77b4", "#2ca02c", "#ff7f0e", "#d62728", "#9467bd", "#bbbbbb"]
                },
                marks: [
                    Plot.ruleY([0]),
                    Plot.axisX({ ticks: "day", tickSize: 28, tickPadding: -9, tickFormat: " %A", textAnchor: "start" }),
                    Plot.axisX({ ticks: "3 hours", tickFormat: "%H:%M" }),
                    Plot.rect(actionMarkers, {
                        x1: "time",
                        x2: "end_time",
                        y1: 0,
                        y2: "power_w",
                        fill: "action",
                        channels: {
                            title: function (d) {
                                return d.battery + '\n' + planFormatTime(new Date(d.time))
                                    + '\nAction: ' + d.action
                                    + '\nPower: ' + d.power_w.toFixed(0) + ' W'
                                    + (d.reason ? '\nReason: ' + d.reason : '');
                            }
                        },
                        tip: true
                    })
                ]
            });
            $('#container-plan-action').empty().append(actionChart);

            // -------- Predicted SoC chart --------
            const socChart = Plot.plot({
                width: 1200,
                height: 240,
                grid: true,
                x: { type: "time", label: "Time" },
                y: { label: "Predicted SoC (%)", domain: [0, 100] },
                color: { legend: true, scheme: "blues" },
                marks: [
                    Plot.ruleY([0]),
                    Plot.axisX({ ticks: "day", tickSize: 28, tickPadding: -9, tickFormat: " %A", textAnchor: "start" }),
                    Plot.axisX({ ticks: "3 hours", tickFormat: "%H:%M" }),
                    Plot.line(socMarkers, {
                        x: "time", y: "soc", stroke: "battery", strokeWidth: 2, curve: "step-after"
                    }),
                    Plot.tip(socMarkers, Plot.pointerX({
                        x: "time", y: "soc",
                        title: function (d) {
                            return d.battery + '\n' + planFormatTime(new Date(d.time)) + '\n' + d.soc.toFixed(1) + ' %';
                        }
                    }))
                ]
            });
            $('#container-plan-soc').empty().append(socChart);
        });
    }

    // Populate provider/battery selectors and load the plan.
    $('#sel-plan-provider').on('change', function () {
        loadPlan($(this).val(), $('#sel-plan-battery').val());
    });
    $('#sel-plan-battery').on('change', function () {
        loadPlan($('#sel-plan-provider').val(), $(this).val());
    });

    // Reuse providers loaded for the price chart, but populate the plan
    // selector independently because it might run before the prices ajax
    // resolves. We attach a small poll on providerMap.
    function populatePlanProviders() {
        const $sel = $('#sel-plan-provider');
        $sel.empty();
        let any = false;
        providerMap.forEach(function (energyTypes, providerName) {
            if (energyTypes.indexOf('electricity') < 0) return;
            $sel.append($('<option>').attr('value', providerName).text(providerName));
            any = true;
        });
        if (any) {
            $sel.trigger('change');
        }
    }
    // Load battery sources for the battery selector.
    $.ajax({ url: "{{$.ContextRoot}}api/battery/sources/" + yesterday.toISOString().split('T')[0] }).done(function (data) {
        const $sel = $('#sel-plan-battery');
        $sel.empty();
        $sel.append($('<option>').attr('value', '').text('All batteries'));
        if (data && data.sources) {
            $.each(data.sources, function (_, name) {
                $sel.append($('<option>').attr('value', name).text(name));
            });
        }
    });
    // Wait for providerMap to be populated by the price-providers ajax above,
    // then populate the plan selector. Poll briefly to avoid ordering races.
    let planInitTries = 0;
    const planInit = setInterval(function () {
        planInitTries++;
        if (providerMap.size > 0) {
            clearInterval(planInit);
            populatePlanProviders();
        } else if (planInitTries > 50) {
            clearInterval(planInit);
            // Still draw an empty plan with default battery selection.
            loadPlan('', '');
        }
    }, 200);

});
</script>
